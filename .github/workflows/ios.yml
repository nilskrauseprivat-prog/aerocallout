# Builds the iOS app on a macOS cloud machine (no Mac needed) and publishes an unsigned IPA as a build artifact.
# Install it on the iPhone with Sideloadly (signs it with your own Apple ID, valid 7 days with a free account).
name: iOS build

on:
  push:
    paths: ["ios/**", "AeroCallout TAS/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    # Two runner types in parallel: the free macOS arm64 pool is sometimes out of capacity.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bundle web app
        run: |
          rm -rf ios/AeroCallout/www
          mkdir -p ios/AeroCallout/www
          cp -R "AeroCallout TAS/index.html" "AeroCallout TAS/css" "AeroCallout TAS/js" \
                "AeroCallout TAS/icon.svg" "AeroCallout TAS/manifest.webmanifest" ios/AeroCallout/www/

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          cd ios
          xcodebuild -project AeroCallout.xcodeproj -scheme AeroCallout -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build > build.log 2>&1 || (grep -E "error|warning: .*Swift" build.log | head -80; tail -60 build.log; exit 1)
          test -d build/Build/Products/Release-iphoneos/AeroCallout.app

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AeroCallout.app Payload/
          zip -qry AeroCallout.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AeroCallout-ipa-${{ matrix.os }}
          path: ios/AeroCallout.ipa
          retention-days: 30
