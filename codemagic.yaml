# Alternative cloud build on Codemagic (free macOS minutes), same steps as .github/workflows/ios.yml.
# Codemagic: sign in with GitHub, add this repository, start the workflow "ios-unsigned".
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events: [push]
    scripts:
      - name: Bundle web app
        script: |
          rm -rf ios/AeroCallout/www
          mkdir -p ios/AeroCallout/www
          cp -R "AeroCallout TAS/index.html" "AeroCallout TAS/css" "AeroCallout TAS/js" \
                "AeroCallout TAS/icon.svg" "AeroCallout TAS/manifest.webmanifest" ios/AeroCallout/www/
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build
        script: |
          cd ios
          xcodebuild -project AeroCallout.xcodeproj -scheme AeroCallout -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AeroCallout.app Payload/
          zip -qry AeroCallout.ipa Payload
    artifacts:
      - ios/AeroCallout.ipa
